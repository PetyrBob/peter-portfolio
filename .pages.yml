# Pages CMS settings: https://app.pagescms.org
# Sign in there with GitHub to add projects and edit your details without code.
# Every save is a commit to this repo, and Vercel publishes it in about a minute.

media:
  - name: images
    label: Images
    input: src/assets/projects
    output: ../../assets/projects
    extensions: [webp, jpg, jpeg, png, avif]
    rename: safe
  - name: files
    label: Files
    input: public/files
    output: /files
    extensions: [pdf]
    rename: safe

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: "{primary}.md"
    exclude: [README.md]
    view:
      primary: title
      fields: [title, category, year, featured, draft]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: One-sentence summary
        description: Shown on project cards. 160 characters at most.
        type: string
        required: true
        options: { maxlength: 160 }
      - name: category
        label: Kind of work
        type: select
        required: true
        options:
          values:
            - { value: ui-ux, label: UI/UX design }
            - { value: branding, label: Logos and branding }
            - { value: social, label: Social media }
            - { value: print, label: Print media }
            - { value: frontend, label: Front-end }
      - name: cover
        label: Cover image
        description: Landscape works best. Export as WebP or JPG, about 2400 px wide.
        type: image
        required: true
        options: { media: images }
      - name: coverAlt
        label: Cover image description
        description: Describe what the image shows, for screen readers.
        type: string
        required: true
      - name: role
        label: Your role
        type: string
        required: true
      - name: tools
        label: Tools
        type: string
        list: true
      - name: year
        label: Year
        type: number
        required: true
        default: 2026
      - name: featured
        label: Show on home page
        type: boolean
        default: false
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
        default: false
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - { name: label, label: Link text, type: string, required: true }
          - { name: url, label: Address, type: string, required: true, pattern: { regex: "^https?://", message: "Start with https://" } }
      - name: body
        label: Case study
        description: The brief, what you did, and the result. You can add images here too.
        type: rich-text
        options: { media: images }

  - name: profile
    label: Profile
    type: file
    path: src/data/profile.json
    fields:
      - { name: name, label: Your name, type: string, required: true }
      - { name: title, label: Browser tab title, type: string, required: true }
      - { name: description, label: Search engine description, type: text, required: true }
      - { name: intro, label: Home page intro, type: text, required: true }
      - { name: email, label: Email, description: Leave empty to hide it., type: string }
      - name: resume
        label: Resume (PDF)
        description: Leave empty to hide the download link.
        type: file
        options: { media: files }
      - name: links
        label: Profile links
        description: A link with an empty address stays hidden.
        type: object
        list: true
        fields:
          - { name: label, label: Name, type: string, required: true }
          - { name: url, label: Address, type: string }

  - name: about
    label: About page
    type: file
    path: src/content/pages/about.md
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: body
        label: Text
        type: rich-text
        options: { media: images }
